<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Grab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f5cba6; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { display: block; touch-action: none; }
  #file { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<input type="file" id="file" accept="image/*">
<script>
'use strict';

// ---------------------------------------------------------------------------
// Constants & palette
// ---------------------------------------------------------------------------
const W = 430, H = 940;                       // logical portrait canvas
const BG = '#f5cba6';
const TRAY = { x: 12, y: 100, w: 406, h: 370 };
const HILL = { x: 215, y: 500 };
const QUEUE_ROWS = 5;                         // visible jar rows per column
const LANE_Y = HILL.y + 30;                   // ants leave their jars along this lane
const ANT_SPEED = 300, SPAWN_GAP = 0.08;       // SPAWN_GAP: game-seconds between ants leaving a jar
const ANIM_SCALE = 0.5;                       // game-time multiplier (ants, spawning)
const BASE_SLOTS = 5;
const GRID_MAX = 45;                          // largest picture side, in blocks
const FONT = 'Fredoka, "Arial Rounded MT Bold", "Segoe UI", sans-serif';

// Art characters -> colors. '.' is empty.
const PALETTE = {
  R: '#ee3b3b', // red
  P: '#f5728c', // pink
  p: '#f9b6d8', // light pink
  O: '#f8922a', // orange
  Y: '#ffe23d', // yellow
  L: '#c9dc5c', // lime
  G: '#35c75a', // green
  g: '#1f7d4f', // dark green
  T: '#1c6c78', // teal
  C: '#44def5', // cyan
  B: '#2b7be9', // blue
  V: '#8c7aac', // violet
  N: '#a3573b', // brown
  K: '#2c2c3a', // black
  W: '#f6f6f2', // white
  S: '#9da0ab', // silver
  E: '#f2d49c', // cream
};
const KEYS = Object.keys(PALETTE);

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(rgb, t) { return rgb.map(v => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t)); }
function rgbStr(a) { return `rgb(${a[0]},${a[1]},${a[2]})`; }
const SH = KEYS.map(k => {
  const rgb = hexToRgb(PALETTE[k]);
  return { rgb, base: PALETTE[k], dark: rgbStr(mix(rgb, -0.25)), darker: rgbStr(mix(rgb, -0.55)) };
});
// ---------------------------------------------------------------------------
// Levels (food, naturally). Each picture is painted per pixel: paint(x, y) gets
// the cell's center and returns a palette key, or '.' where bg(x, y) shows
// through. Every cell ends up filled, so ants start at the border.
// ---------------------------------------------------------------------------
const inEll = (x, y, cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
const ellD = (x, y, cx, cy, rx, ry) => Math.sqrt(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2);
function hash(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const sprinkle = (x, y, rate, keys) => hash(x, y) < rate ? keys[Math.floor(hash(x, y, 7) * keys.length)] : null;
const checker = (X, Y, size, a, b) => (Math.floor(X / size) + Math.floor(Y / size)) % 2 ? a : b;
const clouds = (X, Y) => [[8, 8, 6, 2.5], [14, 6, 4, 2.5], [38, 34, 6, 2.5], [33, 32, 4, 2.2], [40, 14, 4, 2]]
  .some(([cx, cy, rx, ry]) => inEll(X, Y, cx, cy, rx, ry));
function inRR(X, Y, x0, y0, x1, y1, r) {
  if (X < x0 || X > x1 || Y < y0 || Y > y1) return false;
  const cx = Math.max(x0 + r, Math.min(x1 - r, X)), cy = Math.max(y0 + r, Math.min(y1 - r, Y));
  return Math.hypot(X - cx, Y - cy) <= r;
}
function segD(X, Y, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const t = Math.max(0, Math.min(1, ((X - x0) * dx + (Y - y0) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(X - x0 - t * dx, Y - y0 - t * dy);
}
// Coordinates in a frame rotated by `ang` around (cx, cy): [along, across].
function rotUV(X, Y, cx, cy, ang) {
  const c = Math.cos(ang), s = Math.sin(ang), dx = X - cx, dy = Y - cy;
  return [dx * c + dy * s, -dx * s + dy * c];
}

// Unordered picture set; LEVEL_ORDER below decides play order.
const LEVELS = [
  { name: 'Strawberry', w: 46, h: 48,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'C', 'W'),
    paint(X, Y) {
      const cx = 23;
      if (Math.abs(X - cx) < 1.6 && Y < 8) return 'g';
      const leaves = [[cx, 10, 4, 5], [cx - 8, 12, 8, 3.2], [cx + 8, 12, 8, 3.2],
                      [cx - 13, 15, 7, 2.6], [cx + 13, 15, 7, 2.6], [cx - 4, 13, 5, 3], [cx + 4, 13, 5, 3]];
      for (const [lx, ly, rx, ry] of leaves) {
        if (inEll(X, Y, lx, ly, rx, ry)) return ellD(X, Y, lx, ly, rx, ry) > 0.7 ? 'g' : 'G';
      }
      const body = inEll(X, Y, cx, 25, 21, 15) ||
        (Y >= 25 && Y <= 47.5 && Math.abs(X - cx) <= 21 * Math.pow((47.5 - Y) / 22.5, 0.7));
      if (!body) return '.';
      const x = X | 0, y = Y | 0;
      if (y % 5 < 2 && (x + (Math.floor(y / 5) % 2) * 3) % 6 === 2) return 'Y';
      if (inEll(X, Y, 11, 21, 1.6, 1.6)) return 'W';
      if (inEll(X, Y, 13, 24, 4, 6)) return 'P';
      return 'R';
    } },
  { name: 'Watermelon', w: 48, h: 46,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'B', 'W'),
    paint(X, Y) {
      const d = ellD(X, Y, 24, -1, 24, 46);
      if (d > 1) return '.';
      if (Math.hypot(X - 10, Y) < 4.5 || Math.hypot(X - 36, Y) < 3.5) return '.';   // bites
      if (d > 0.93) return Math.floor(Math.atan2(Y + 1, X - 24) * 22) % 2 ? 'g' : 'G';
      if (d > 0.87) return 'L';
      if (d > 0.82) return 'W';
      if (d > 0.75) return 'P';
      const x = X | 0, y = Y | 0;
      if (d < 0.72 && y % 7 >= 3 && y % 7 <= 4 && (x + (Math.floor(y / 7) % 2) * 4) % 8 === 3) return 'K';
      return 'R';
    } },
  { name: 'Ice Cream', w: 46, h: 48,
    bg: (X, Y) => clouds(X, Y) ? 'W' : 'C',
    paint(X, Y) {
      const cx = 23, x = X | 0, y = Y | 0;
      if (inEll(X, Y, cx + 1, 4, 3.6, 3.6)) return inEll(X, Y, cx, 3, 1.2, 1.2) ? 'W' : 'R';
      if (Y < 2 && Math.abs(X - (cx + 3 + (2 - Y) * 1.2)) < 0.9) return 'g';
      if (inEll(X, Y, cx, 13, 13, 8.5)) {
        if (inEll(X, Y, cx - 5, 10, 3, 2)) return 'p';
        return sprinkle(x, y, 0.08, ['Y', 'C', 'B', 'G', 'W']) || 'P';
      }
      if (inEll(X, Y, cx, 22, 18, 7.5) || (Y > 22 && Y <= 28 + 1.5 * Math.sin(X * 0.9) && Math.abs(X - cx) <= 17)) {
        return sprinkle(x, y, 0.07, ['N']) || 'W';
      }
      if (Y >= 27 && Math.abs(X - cx) <= 15.5 * (47.5 - Y) / 20.5) {
        if (Y < 30) return 'N';
        return ((x + y) % 5 === 0 || (x - y + 100) % 5 === 0) ? 'N' : 'O';
      }
      return '.';
    } },
  { name: 'Donut', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => ((X | 0) % 6 < 2 && (Y | 0) % 6 < 2) ? 'C' : 'T',
    paint(X, Y) {
      const c = 24, r = Math.hypot(X - c, Y - c), a = Math.atan2(Y - c, X - c);
      if (r > 23.5 || r < 7.5) return '.';
      if (r < 9.3) return 'N';
      const fo = 20 + 1.6 * Math.sin(a * 7) + 0.8 * Math.sin(a * 3 + 1), fi = 11 + 0.9 * Math.sin(a * 5);
      if (r < fo && r > fi) {
        if (inEll(X, Y, 14, 13, 5, 2.5)) return 'p';
        return sprinkle(X | 0, Y | 0, 0.07, ['Y', 'W', 'C', 'B', 'G']) || 'P';
      }
      return (Y > c && r > 21.3) ? 'N' : 'O';
    } },
  { name: 'Cupcake', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => Math.floor((X + Y) / 3) % 2 ? 'Y' : 'E',
    paint(X, Y) {
      const cx = 24;
      if (inEll(X, Y, cx, 4, 3.5, 3.5)) return inEll(X, Y, cx - 1, 3, 1, 1) ? 'W' : 'R';
      const tiers = [[cx, 29, 22, 5], [cx, 22, 18, 5.5], [cx, 15, 13, 5], [cx, 9, 7, 4]];
      for (const [tx, ty, rx, ry] of tiers) {
        if (!inEll(X, Y, tx, ty, rx, ry)) continue;
        if (Y > ty && ellD(X, Y, tx, ty, rx, ry) > 0.72) return 'P';
        return sprinkle(X | 0, Y | 0, 0.05, ['Y', 'C', 'B', 'G']) || 'p';
      }
      if (Y >= 31 && Y <= 47.5 && Math.abs(X - cx) <= 19 - (Y - 31) * 0.2) {
        return Math.floor((X - cx + 30) / 3) % 2 ? 'B' : 'C';
      }
      return '.';
    } },
  { name: 'Burger', w: 48, h: 46,
    bg: (_X, _Y, X, Y) => Math.floor(Y / 3) % 2 ? 'T' : 'C',
    paint(X, Y) {
      const cx = 24, x = X | 0, y = Y | 0, half = Math.abs(X - cx);
      if (Y <= 16.5) {
        if (!inEll(X, Y, cx, 16.5, 23.5, 16)) return '.';
        if (inEll(X, Y, 14, 6, 5, 2.2)) return 'Y';
        if (y % 4 === 1 && (x + (Math.floor(y / 4) % 2) * 3) % 6 < 2) return 'E';
        return 'O';
      }
      if (Y <= 20.5 + 1.2 * Math.sin(X * 0.8)) return half > 24 ? '.' : (Y > 19 + 1.2 * Math.sin(X * 0.8) ? 'g' : 'G');
      if (Y <= 24.5) return half > 22 ? '.' : (hash(x, y) < 0.1 ? 'P' : 'R');
      if (Y <= 27.5) return 'Y';
      for (const dx of [6, 15, 27, 38]) if (Y <= 32 && Math.abs(X - dx) <= (32 - Y) * 0.55) return 'Y';
      if (Y <= 36.5) {
        if (half > 23 - (Y > 35 ? 1 : 0)) return '.';
        return ((x + y) % 8 === 0 || hash(x, y) < 0.08) ? 'K' : 'N';
      }
      if (Y <= 45.5) {
        if (half > 23 - Math.max(0, Y - 42) * 1.2) return '.';
        return Y > 43 ? 'N' : 'O';
      }
      return '.';
    } },
  { name: 'Pizza', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'R', 'W'),
    paint(X, Y) {
      const cx = 24, x = X | 0, y = Y | 0;
      const crustTop = 3 - 3 * Math.sqrt(Math.max(0, 1 - ((X - cx) / 24) ** 2));
      if (Y < crustTop) return '.';
      if (Y < 6.5) {
        if (Y < crustTop + 1.2) return 'N';
        return hash(x, y) < 0.12 ? 'E' : 'O';
      }
      const hw = 23 * (47.5 - Y) / 41;
      if (Math.abs(X - cx) > hw) return '.';
      if (Math.abs(X - cx) > hw - 1.3) return 'O';
      for (const [px, py] of [[13, 13], [33, 13], [23, 22], [29, 31], [19, 32]]) {
        if (Math.hypot(X - px, Y - py) < 3.8) return hash(x, y) < 0.15 ? 'N' : 'R';
      }
      for (const [gx, gy] of [[24, 12], [14, 21], [32, 22], [24, 38]]) {
        const r = Math.hypot(X - gx, Y - gy);
        if (r > 1.8 && r < 3 && Y < gy + 1) return 'G';
      }
      for (const [ox, oy] of [[8, 9], [40, 9], [20, 16], [27, 33]]) {
        const r = Math.hypot(X - ox, Y - oy);
        if (r < 2) return r > 0.9 ? 'K' : 'Y';
      }
      return hash(x, y) < 0.05 ? 'E' : 'Y';
    } },
  { name: 'Cherries', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => Math.floor(X / 4) % 2 ? 'Y' : 'W',
    paint(X, Y) {
      const [u, v] = rotUV(X, Y, 36, 9, -0.5);
      if ((u / 8) ** 2 + (v / 3.5) ** 2 <= 1) return Math.abs(v) < 0.7 ? 'g' : 'G';
      if (segD(X, Y, 15, 26, 28, 6) < 1.1 || segD(X, Y, 33, 28, 28, 6) < 1.1) return 'g';
      for (const [cx, cy] of [[15, 34], [33, 36]]) {
        const r = Math.hypot(X - cx, Y - cy);
        if (r >= 10.5) continue;
        if (inEll(X, Y, cx - 4, cy - 4, 1.6, 1.6)) return 'W';
        if (inEll(X, Y, cx - 3, cy - 3, 4.5, 3.5)) return 'P';
        return r > 9.2 && Y > cy ? 'N' : 'R';
      }
      return '.';
    } },
  { name: 'Fried Egg', w: 48, h: 48, outline: 'N',
    bg: (X, Y) => Math.hypot(X - 24, Y - 24) < 22.3 ? 'K' : 'T',
    paint(X, Y) {
      const r = Math.hypot(X - 24, Y - 24), a = Math.atan2(Y - 24, X - 24);
      if (r >= 22.3 && r < 23.6) return 'S';                 // pan rim
      const yr = Math.hypot(X - 26, Y - 22);
      if (yr < 7) {
        if (inEll(X, Y, 24, 20, 2, 1.5)) return 'W';
        return yr > 6 && Y > 22 ? 'O' : 'Y';
      }
      const R = 17 + 2.5 * Math.sin(a * 3) + 1.5 * Math.sin(a * 5 + 1);
      if (r < R) return r > R - 1.3 ? 'E' : 'W';
      return '.';
    } },
  { name: 'Lime', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => Math.floor((X - Y + 96) / 4) % 2 ? 'B' : 'W',
    paint(X, Y) {
      const r = Math.hypot(X - 24, Y - 24), a = Math.atan2(Y - 24, X - 24);
      if (r > 22.5) return '.';
      if (r > 20.5) return 'G';
      if (r > 18.8 || r < 2.2) return 'W';
      const seg = Math.PI / 5, m = ((a % seg) + seg) % seg;
      if (Math.min(m, seg - m) * r < 0.8) return 'W';        // membranes
      return hash(X | 0, Y | 0) < 0.1 ? 'Y' : 'L';
    } },
  { name: 'Cookie', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => ((X | 0) % 8 < 2 && (Y | 0) % 8 < 2) ? 'W' : 'C',
    paint(X, Y) {
      const r = Math.hypot(X - 24, Y - 24), bite = Math.hypot(X - 43, Y - 7);
      if (r > 22.5 || bite < 9) return '.';
      if (r > 20.8 || bite < 10.3) return 'N';
      for (const [cx, cy] of [[14, 14], [25, 11], [33, 20], [17, 24], [28, 28], [12, 33], [22, 37], [35, 34], [8, 23], [30, 40]]) {
        if (Math.hypot(X - cx, Y - cy) < 2.1) return 'K';
      }
      const h = hash(X | 0, Y | 0);
      return h < 0.07 ? 'N' : h < 0.12 ? 'Y' : 'O';
    } },
  { name: 'Avocado', w: 46, h: 48,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'p', 'W'),
    paint(X, Y) {
      const inS = k => inEll(X, Y, 23, 30, 20 * k, 17 * k) || inEll(X, Y, 23, 15, 12 * k, 13 * k);
      if (!inS(1)) return '.';
      if (!inS(0.92)) return 'g';
      if (Math.hypot(X - 23, Y - 30) < 8.5) return inEll(X, Y, 20, 27, 2.5, 1.8) ? 'O' : 'N';
      if (!inS(0.84)) return 'G';
      if (!inS(0.7)) return 'L';
      return 'E';
    } },
  { name: 'Lollipop', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => Math.floor(Y / 4) % 2 ? 'C' : 'W',
    paint(X, Y) {
      if (Math.abs(X - 24) < 1.8 && Y > 34) return X > 24.4 ? 'O' : 'E';
      const r = Math.hypot(X - 24, Y - 18), a = Math.atan2(Y - 18, X - 24);
      if (r > 17) return '.';
      if (r > 15.8) return 'P';
      if (inEll(X, Y, 17, 11, 3, 1.8)) return 'W';
      return ['R', 'W', 'Y'][Math.floor((a + Math.PI + r * 0.32) / (Math.PI / 3)) % 3];
    } },
  { name: 'Popsicle', w: 46, h: 48,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'V', 'p'),
    paint(X, Y) {
      if (X >= 19 && X <= 27 && Y >= 37) return (X < 20 || X > 26 || Y > 46) ? 'N' : 'E';
      if (!inRR(X, Y, 9, 2, 37, 37, 11) || Math.hypot(X - 36, Y - 5) < 6) return '.';
      if (X > 12.5 && X < 14.5 && Y > 10 && Y < 30) return 'W';
      return Y < 11 ? 'R' : Y < 19 ? 'O' : Y < 27 ? 'Y' : 'G';
    } },
  { name: 'Sushi', w: 48, h: 46,
    bg: (_X, _Y, X, Y) => Math.floor(Y / 3) % 2 ? 'T' : 'C',
    paint(X, Y) {
      const nori = Math.abs(X - 24) < 3.5;
      if (inEll(X, Y, 24, 20, 21, 9) && Y < 27) {
        if (nori) return 'K';
        return ((X * 0.7 + Y) % 5 + 5) % 5 < 1.1 ? 'W' : 'O';
      }
      if (inEll(X, Y, 24, 29, 19, 8)) {
        if (nori) return 'K';
        return hash(X | 0, Y | 0) < 0.15 ? 'E' : 'W';
      }
      if (inEll(X, Y, 24, 38, 23.5, 7)) return inEll(X, Y, 24, 37, 21.5, 5.5) ? 'B' : 'W';
      if (inEll(X, Y, 6, 8, 4, 3)) return 'L';               // wasabi
      return '.';
    } },
  { name: 'Pancakes', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'V', 'W'),
    paint(X, Y) {
      if (X >= 19 && X <= 29 && Y >= 7 && Y < 13) return Y < 9 ? 'E' : 'Y';   // butter
      for (const [dx, end] of [[8, 22], [17, 27], [31, 20], [40, 25]]) {
        if (Math.abs(X - dx) < 1.3 && Y >= 13 && Y < end) return 'N';        // syrup drips
      }
      for (let k = 0; k < 4; k++) {
        const y0 = 13 + k * 6;
        if (inRR(X, Y, 3, y0, 45, y0 + 6, 3)) return k === 0 && Y < 15.5 ? 'N' : Y >= y0 + 5 ? 'N' : 'O';
      }
      if (inEll(X, Y, 24, 40, 23.5, 5)) return Y > 41.5 ? 'S' : 'W';
      return '.';
    } },
  { name: 'Coffee', w: 48, h: 48,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'V', 'p'),
    paint(X, Y) {
      for (const sx of [14, 22, 30]) {
        if (Y > 1 && Y < 10 && Math.abs(X - (sx + 1.8 * Math.sin(Y * 0.7 + sx))) < 0.9) return 'W';   // steam
      }
      const hr = Math.hypot(X - 37, Y - 27);
      if (hr < 8 && hr > 4.8 && X > 33) return 'W';          // handle
      if (inEll(X, Y, 22, 43, 21, 3.5)) return Y > 44 ? 'S' : 'W';
      if (inEll(X, Y, 20, 16, 13, 3.5)) {
        const heart = inEll(X, Y, 18.5, 15.3, 1.8, 1.2) || inEll(X, Y, 21.5, 15.3, 1.8, 1.2) ||
          (Y > 15.3 && Y < 18 && Math.abs(X - 20) < (18 - Y) * 1.3);
        return heart ? 'E' : 'N';
      }
      if (inEll(X, Y, 20, 16, 14.5, 4.5)) return 'W';         // rim
      if (X >= 6 && X <= 34 && Y >= 16 && inRR(X, Y, 6, 0, 34, 42, 8)) return X > 30 ? 'S' : 'W';
      return '.';
    } },
  { name: 'Taco', w: 48, h: 46,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'T', 'C'),
    paint(X, Y) {
      const r = Math.hypot(X - 24, Y - 40), a = Math.atan2(Y - 40, X - 24);
      if (Y > 40.5) return r < 23 && Y < 43 ? 'O' : '.';
      if (r > 23) return '.';
      if (r > 18.5) return hash(X | 0, Y | 0) < 0.12 ? 'O' : 'Y';     // shell
      if (r > 15.5 + Math.sin(a * 14)) return 'G';                     // lettuce
      if ((X | 0) % 5 < 2 && (Y | 0) % 5 < 2 && r < 14) return 'R';   // tomato
      return hash(X | 0, Y | 0) < 0.18 ? 'E' : 'N';                    // cheese, meat
    } },
  { name: 'Cake', w: 48, h: 46,
    bg: (_X, _Y, X, Y) => checker(X, Y, 4, 'B', 'C'),
    paint(X, Y) {
      if (Y < 2.5 && Math.abs(X - 24) < 3) return 'G';
      if (Math.hypot(X - 24, Y - 6) < 4.5) return hash(X | 0, Y | 0) < 0.15 ? 'Y' : 'R';
      if (Y >= 41 && Y < 45 && Math.abs(X - 24) < 23) return Y >= 44 ? 'S' : 'W';     // plate
      if (X < 6 || X > 42) return '.';
      if (Y >= 9 && Y < 13) return 'p';                                               // frosting
      if (Y >= 13 && Y < 16 && [10, 19, 29, 37].some(d => Math.abs(X - d) < 1.5)) return 'p';
      if (Y >= 13 && Y < 41) {
        const k = (Y - 13) % 9;

// Hill-climb from a winnable peel order toward the level's target failure rate,
// never accepting a queue that can't be proven winnable. Stops at the target, or
// after `iters` iterations or `ms` milliseconds; a fixed seed and no time limit
// make the result reproducible.
function buildQueue(board, def, { seed = (Math.random() * 2 ** 31) | 0, iters = Infinity, ms = Infinity, budget = 600 } = {}) {
  const prevRng = rng;
  rng = mulberry32(seed);
  const t0 = performance.now(), RUNS = 16, miss = s => Math.abs(s - def.target);
  let best = null, seq = null, score = -1, sinceGain = 0;
  const restart = () => {
    for (let attempt = 0; attempt < 40; attempt++) {
      seq = genSequence(board, def.chunk);
      score = rateQueue(board, deal(seq), RUNS, budget);
      if (score >= 0) break;
    }
    sinceGain = 0;
  };
  try {
    restart();
    for (let it = 0; it < iters && performance.now() - t0 < ms; it++) {
      if (score >= 0 && (!best || miss(score) < miss(best.score))) best = { seq, score };
      if (best && miss(best.score) <= 0.03) break;
      if (++sinceGain > 60) { restart(); continue; }     // stalled: try a fresh start
      // Far below target: merge and pull forward many jars at once (lone moves rarely
      // matter with 5 slots of slack). Near target: fine-tune with small moves.
      const cand = mutate(seq, def, def.target - score > 0.15);
      const s = rateQueue(board, deal(cand), RUNS, budget);
      if (s >= 0 && miss(s) <= miss(score)) {
        if (miss(s) < miss(score)) sinceGain = 0;
        seq = cand; score = s;
      }
    }
  } finally {
    rng = prevRng;
  }
  if (score >= 0 && (!best || miss(score) < miss(best.score))) best = { seq, score };
  if (best) seq = best.seq;
  S.lastFail = best ? best.score : 0;
  return deal(seq);
}

const encodeQueue = cols => cols.map(col => col.map(s => KEYS[s.c] + s.n).join(' ')).join('|');
const decodeQueue = str => str.split('|').map(col => col ? col.split(' ').map(t => ({ c: KEYS.indexOf(t[0]), n: +t.slice(1) })) : []);

// Dev tool, run from the console: regenerates level queues (fixed seeds, big search
// budget, best of several seeds) and returns BAKED lines to paste into the source.
async function bake(from = 0, to = LEVEL_DEFS.length - 1, { iters = 3000, seeds = 4, ms = 12000 } = {}) {
  const lines = [];
  for (let i = from; i <= to; i++) {
    const d = LEVEL_DEFS[i], b = new Board(d.w, d.h, d.cells), t0 = performance.now();
    let best = null;
    for (let s = 0; s < seeds; s++) {
      const cols = buildQueue(b, d, { seed: (i + 1) * 100 + s, iters, ms, budget: 3000 });
      if (!best || Math.abs(S.lastFail - d.target) < Math.abs(best.fail - d.target)) best = { cols, fail: S.lastFail };
      if (Math.abs(best.fail - d.target) <= 0.03) break;
      await new Promise(r => setTimeout(r, 0));
    }
    lines.push(`  '${d.name}': '${encodeQueue(best.cols)}', // fail ${best.fail.toFixed(2)} of target ${d.target}`);
    console.log(`baked ${d.name}: fail ${best.fail.toFixed(2)} / ${d.target} in ${((performance.now() - t0) / 1000).toFixed(1)}s`);
    await new Promise(r => setTimeout(r, 0));
  }
  return lines.join('\n');
}

// ---------------------------------------------------------------------------
// Image -> level
// ---------------------------------------------------------------------------
function nearestColor(r, g, b, among) {
  let best = -1, bd = Infinity;
  const list = among || SH.map((_, i) => i);
  for (const i of list) {
    const [R, G, B] = SH[i].rgb, rm = (r + R) / 2;
    const dr = r - R, dg = g - G, db = b - B;
    const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// Center-crop to a square and fill a size×size grid completely (transparent
// areas are composited onto white).
function pixelate(img, size) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if (!iw || !ih) return null;
  const side = Math.min(iw, ih);

  // Halve repeatedly first so the final downscale averages instead of aliasing.
  let src = document.createElement('canvas');
  src.width = src.height = side;
  src.getContext('2d').drawImage(img, (iw - side) / 2, (ih - side) / 2, side, side, 0, 0, side, side);
  let s = side;
  while (s / 2 > size * 2) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.round(s / 2);
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.drawImage(src, 0, 0, c.width, c.height);
    src = c; s = c.width;
  }
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff';
  g.fillRect(0, 0, size, size);
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, 0, 0, size, size);
  const d = g.getImageData(0, 0, size, size).data;
  let cells = new Array(size * size);
  for (let i = 0; i < size * size; i++) cells[i] = nearestColor(d[i * 4], d[i * 4 + 1], d[i * 4 + 2]);

  // Keep the palette small: fold rare colors into their nearest kept neighbour.
  const counts = new Map();
  for (const v of cells) counts.set(v, (counts.get(v) || 0) + 1);
  const sorted = [...counts].sort((a, b) => b[1] - a[1]);
  const minCount = Math.round(cells.length * 0.006);
  let keep = sorted.filter(([, n]) => n >= minCount).slice(0, 10).map(([k]) => k);
  if (!keep.length) keep = [sorted[0][0]];
  const remap = new Map();
  for (const [k] of sorted) if (!keep.includes(k)) remap.set(k, nearestColor(...SH[k].rgb, keep));
  cells = cells.map(v => remap.has(v) ? remap.get(v) : v);
  return { w: size, h: size, cells };
}

let actx = null, muted = load('pixelgrab.muted', false), music = null;
let musicTrack = load('pixelgrab.track', 0);             // index into TRACKS, -1 = off
const midiHz = m => 440 * 2 ** ((m - 69) / 12);
function audioUnlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (actx.state === 'suspended') actx.resume();

function tone(f, dur = 0.08, type = 'sine', vol = 0.08, delay = 0, slide = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;

  g.gain.exponentialRampToValueAtTime(vol, t + 0.01);

// ---------------------------------------------------------------------------
// Music: three soft procedural tracks sharing a generated reverb. Each track has a
// tempo, 16th-note steps per bar, a length in bars, the chord under a given bar
// (so sound effects can harmonize), and a play() that schedules one step. The
// scheduler runs a little ahead of the audio clock.
// ---------------------------------------------------------------------------
function startMusic() {
  if (music || !actx) return;
  const out = actx.createGain(), lp = actx.createBiquadFilter();
  out.gain.value = musicTrack >= 0 && !muted ? 0.8 : 0;
  lp.type = 'lowpass'; lp.frequency.value = 4500;
  out.connect(lp).connect(actx.destination);
  // Reverb from decaying noise: soft and roomy without any sample files.
  const len = Math.round(actx.sampleRate * 2.8), ir = actx.createBuffer(2, len, actx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = ir.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3;
  }
  const verb = actx.createConvolver();
  verb.buffer = ir;
  verb.connect(out);
  const noise = actx.createBuffer(1, Math.round(actx.sampleRate * 0.2), actx.sampleRate), nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  music = { out, verb, noise, step: 0, next: actx.currentTime + 0.15 };
  setInterval(() => {
    const tr = TRACKS[Math.max(0, musicTrack)], dt = 60 / tr.bpm / 4;
    // After a stall (busy frame, hidden tab), skip the missed steps rather than
    // playing them all at once.
    while (music.next < actx.currentTime - 0.02) {
      music.step = (music.step + 1) % (tr.bars * tr.spb);
      music.next += dt;
    }
    while (music.next < actx.currentTime + 0.3) {
      if (musicTrack >= 0) tr.play(music.step, music.next, dt);
      music.step = (music.step + 1) % (tr.bars * tr.spb);
      music.next += dt;
    }

}
function syncMusic() {
  if (music) music.out.gain.setTargetAtTime(musicTrack >= 0 && !muted ? 0.8 : 0, actx.currentTime, 0.15);
}
function nextTrack() {
  musicTrack = musicTrack >= TRACKS.length - 1 ? -1 : musicTrack + 1;
  save('pixelgrab.track', musicTrack);
  if (music) { music.step = 0; music.next = actx.currentTime + 0.1; }
  syncMusic();
  S.toast = { text: musicTrack >= 0 ? `Music: ${TRACKS[musicTrack].name}` : 'Music off', t: 1.6 };
}

// Route a voice to the mix, with some of it into the reverb.
function mixOut(g, wet) {
  g.connect(music.out);
  const s = actx.createGain();
  s.gain.value = wet;
  g.connect(s).connect(music.verb);
}
function envelope(g, t, vol, attack, hold, release) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(vol * 0.4, t + attack + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
}
// Electric piano: gentle 1:1 FM whose brightness fades as the note rings.
function keys(notes, t, dur, vol) {

    const f = midiHz(m), car = actx.createOscillator(), mod = actx.createOscillator();
    const mg = actx.createGain(), g = actx.createGain();
    car.frequency.value = f; mod.frequency.value = f;
    mg.gain.setValueAtTime(f * 1.1, t);
    mg.gain.exponentialRampToValueAtTime(f * 0.06, t + 0.7);
    mod.connect(mg).connect(car.frequency);
    envelope(g, t, vol, 0.008, dur, 0.6);
    car.connect(g); mixOut(g, 0.35);
    const end = t + dur + 0.7;
    car.start(t); mod.start(t); car.stop(end); mod.stop(end);
  }
}
// Plucked tine (kalimba) or music box: a sine with a quick bright partial.
function tine(m, t, vol, { partial = 3, decay = 1.2, wet = 0.4 } = {}) {
  const f = midiHz(m), g = actx.createGain(), o = actx.createOscillator(), o2 = actx.createOscillator(), g2 = actx.createGain();
  o.frequency.value = f; o2.frequency.value = f * partial;
  envelope(g, t, vol, 0.004, 0.05, decay);
  g2.gain.setValueAtTime(0.35, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); o2.connect(g2).connect(g); mixOut(g, wet);
  const end = t + decay + 0.1;
  o.start(t); o2.start(t); o.stop(end); o2.stop(end);
}
// Warm pad: detuned triangles through a low filter, slow swell and release.
function pad(notes, t, dur, vol) {
  const lp = actx.createBiquadFilter(), g = actx.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 950;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 1.6);
  g.gain.setValueAtTime(vol, t + dur);
  g.gain.linearRampToValueAtTime(0.0001, t + dur + 2);
  lp.connect(g); mixOut(g, 0.6);
  for (const m of notes) for (const cents of [-7, 7]) {
    const o = actx.createOscillator();
    o.type = 'triangle'; o.frequency.value = midiHz(m); o.detune.value = cents;
    o.connect(lp); o.start(t); o.stop(t + dur + 2.1);
  }
}
function bass(m, t, dur, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = midiHz(m);
  envelope(g, t, vol, 0.03, dur * 0.6, dur * 0.6);
  o.connect(g); mixOut(g, 0.1);
  o.start(t); o.stop(t + dur * 1.3);
}
function brush(t, vol) {
  const src = actx.createBufferSource(), bp = actx.createBiquadFilter(), g = actx.createGain();
  src.buffer = music.noise;
  bp.type = 'bandpass'; bp.frequency.value = 4500; bp.Q.value = 0.7;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  src.connect(bp).connect(g); mixOut(g, 0.2);
  src.start(t); src.stop(t + 0.08);

const GARDEN_CHORDS = [[53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59]];   // Fmaj7 Em7 Dm7 Cmaj7
const GARDEN_MELODY = [                                   // per bar: [16th, midi]
  [[0, 76], [6, 74], [8, 72]], [[0, 71], [4, 74], [8, 79]], [[0, 77], [6, 76], [8, 74], [12, 72]], [[0, 71], [4, 67], [8, 76]],
  [[4, 69], [6, 72], [8, 76], [12, 79]], [[0, 79], [6, 76], [8, 74]], [[0, 72], [4, 74], [8, 77], [12, 76]], [[0, 76]],
];
const RAIN_CHORDS = [                                     // Am9 Fmaj9 C6/9 Gsus, two bars each
  { root: 45, pad: [57, 60, 64, 71] }, { root: 41, pad: [57, 60, 64, 67] },
  { root: 48, pad: [55, 59, 62, 64] }, { root: 43, pad: [55, 57, 62, 64] },
];
const RAIN_BELLS = [69, 72, 74, 76, 79, 81, 84];          // A minor pentatonic
const BOX_CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];                    // C Am F G
const BOX_MELODY = [                                      // per bar of 3/4: [16th, midi]; beats at 0, 4, 8
  [[0, 79], [6, 76], [8, 77]], [[0, 76], [8, 72]], [[0, 77], [4, 76], [8, 74]], [[0, 74], [8, 71]],
  [[0, 72], [4, 76], [8, 79]], [[0, 81], [6, 79], [8, 76]], [[0, 77], [4, 81], [8, 79]], [[0, 74], [8, 71]],
];

const TRACKS = [
  { name: 'Garden', bpm: 70, spb: 16, bars: 16,
    chordAt: bar => GARDEN_CHORDS[bar % 4],
    play(step, t, dt) {
      const bar = step >> 4, s = step & 15, c = GARDEN_CHORDS[bar % 4];
      if (s === 0) { keys(c, t, dt * 7, 0.03); bass(c[0] - 12, t, dt * 8, 0.13); }
      if (s === 6) keys([c[1] + 12, c[3]], t, dt * 2, 0.016);
      if (s === 10) { keys(c, t, dt * 5, 0.02); bass(c[2] - 12, t, dt * 5, 0.09); }
      if (bar < 8) {
        for (const [at, n] of GARDEN_MELODY[bar]) if (at === s) tine(n, t, 0.05);
      } else if (s === 12 && bar % 2) tine(c[3] + 12, t, 0.035, { decay: 2 });
      if (s % 4 === 2) brush(t, 0.006);
    } },
  { name: 'Rain', bpm: 56, spb: 16, bars: 8,
    chordAt: bar => RAIN_CHORDS[(bar >> 1) % 4].pad,
    play(step, t, dt) {
      const bar = step >> 4, s = step & 15, ch = RAIN_CHORDS[(bar >> 1) % 4];
      if (bar % 2 === 0 && s === 0) { pad(ch.pad, t, dt * 30, 0.018); bass(ch.root, t, dt * 28, 0.06); }
      if (s % 2 === 0 && hash(step, 17, 3) < 0.16) {
        tine(RAIN_BELLS[Math.floor(hash(step, 5, 9) * RAIN_BELLS.length)], t, 0.03, { partial: 2.76, decay: 2.8, wet: 0.8 });
      }
    } },
  { name: 'Music Box', bpm: 84, spb: 12, bars: 16,
    chordAt: bar => BOX_CHORDS[bar % 4],
    play(step, t, dt) {
      const bar = Math.floor(step / 12), s = step % 12, c = BOX_CHORDS[bar % 4];
      if (s === 0) bass(c[0] - 12, t, dt * 11, 0.09);
      if (s % 2 === 0) tine(c[[0, 1, 2, 1, 2, 1][s / 2]] + 12, t, 0.014, { partial: 4, decay: 1.4 });
      for (const [at, n] of BOX_MELODY[bar % 8]) {
        if (at !== s) continue;
        if (bar < 8) tine(n, t, 0.045, { partial: 4, decay: 1.8 });
        else keys([n - 12], t, dt * 4, 0.03);
      }
    } },
];

// Sound effects stay in key: notes come from the chord playing right now.
function currentChord() {
  if (!music || musicTrack < 0) return [60, 64, 67, 71];
  const tr = TRACKS[musicTrack];
  return tr.chordAt(Math.floor(music.step / tr.spb));
}
// Length of a 16th note in the playing track (a default without music), and the
// seconds from now to the next one, so incidental sounds land in time with it.
const gridStep = () => music && musicTrack >= 0 ? 60 / TRACKS[musicTrack].bpm / 4 : 0.09;
function toGrid() {
  if (!music || musicTrack < 0) return 0;
  const dt = gridStep(), ahead = music.next - actx.currentTime;
  return Math.max(0, ahead - dt * Math.floor(ahead / dt));
}
let lastPip = -1;
// A soft pip as each ant leaves its jar: at most one per 16th note, on the beat grid,
// so a stream of ants plays a gentle rhythm with the music.
function sfxAnt() {
  if (!actx) return;
  const at = actx.currentTime + toGrid();
  if (at - lastPip < 0.06) return;
  lastPip = at;
  tone(midiHz(pickOne(currentChord()) + 24), 0.06, 'sine', 0.012, at - actx.currentTime);
}
const sfxTap = () => tone(midiHz(pickOne(currentChord()) + 12), 0.18, 'sine', 0.05);   // instant: it answers a touch
const sfxJar = () => {
  const n = pickOne(currentChord()) + 24, wait = toGrid();
  tone(midiHz(n), 0.3, 'sine', 0.04, wait);

const sfxNo = () => tone(midiHz(43), 0.18, 'sine', 0.07, 0, 0.85);
const sfxWin = () => [72, 76, 79, 84, 88].forEach((n, i) => tone(midiHz(n), 0.35, 'sine', 0.06, i * 0.12));
const sfxStuck = () => { tone(midiHz(69), 0.3, 'sine', 0.06); tone(midiHz(65), 0.45, 'sine', 0.06, 0.25); };

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const boardCv = document.createElement('canvas');
const boardCtx = boardCv.getContext('2d');
let scale = 1, dpr = 1, boardDirty = true, G = null;
let erased = [];                              // cells taken since the last frame
let buttons = [];

const S = {
  levelIdx: 0, def: null, board: null, cols: [[], [], []], slots: [], ants: [], parts: [],
  speed: 1, extraUsed: false, state: 'play', overlay: null, stuckT: 0, winT: 0, placed: 0, time: 0, toast: null,
};

// A jar has two sides. Logic: `need` blocks not yet assigned. Animation: `todo`,
// assigned blocks whose ants haven't left yet, and `rem`, the number shown, which
// drops as each ant leaves.
function makeJar(s) {
  return { c: s.c, size: s.n, rem: s.n, need: s.n, todo: [], state: 'queue', slot: -1,
    x: 0, y: 0, w: 88, h: 68, tx: 0, ty: 0, tw: 88, th: 68, lid: 0, tlid: 0,
    doneT: 0, spawnT: 0, shake: 0, front: false };
}

function loadLevel(def) {
  S.def = def;
  S.board = new Board(def.w, def.h, def.cells);
  // Uploaded images get a queue generated once, so retrying replays the same puzzle.
  if (!def.queue) def.queue = encodeQueue(buildQueue(S.board, def, { ms: 900 }));
  S.cols = decodeQueue(def.queue).map(col => col.map(makeJar));
  S.slots = new Array(BASE_SLOTS).fill(null);
  S.ants = []; S.parts = [];
  S.extraUsed = false; S.state = 'play'; S.overlay = null;
  S.stuckT = 0; S.winT = 0; S.placed = 0;
  S.active = [];            // placed jars still needing blocks, in placement order
  S.pending = new Map();    // cell -> color: taken logically, still drawn until picked up
  S.total = S.board.count;
  computeGeom();
  layoutJars(true);
  boardDirty = true;
}
function loadBuiltin(i) {
  const n = LEVEL_DEFS.length;
  S.levelIdx = ((i % n) + n) % n;
  save('pixelgrab.level', S.levelIdx);
  loadLevel(LEVEL_DEFS[S.levelIdx]);
}
const restart = () => loadLevel(S.def);

function geomFor(bw, bh) {
  const iw = TRAY.w - 28, ih = TRAY.h - 28;
  const cell = Math.min(iw / bw, ih / bh, 26);
  return { cell, w: bw * cell, h: bh * cell,

}
function computeGeom() { G = geomFor(S.board.w, S.board.h); }
function cellCenter(i) {
  const w = S.board.w;
  return { x: G.x + (i % w + 0.5) * G.cell, y: G.y + (((i / w) | 0) + 0.5) * G.cell };
}
function slotRect(i) {

  const tot = n * sw + (n - 1) * gap, x0 = 215 - tot / 2;

}

const QY = r => 650 + r * 57;

function layoutJars(snap) {
  S.cols.forEach((col, k) => col.forEach((j, r) => {
    j.tx = QX(k); j.ty = QY(r < QUEUE_ROWS ? r : QUEUE_ROWS + 0.6); j.tw = 88; j.th = 46; j.tlid = 0; j.front = r === 0;
  }));
  S.slots.forEach((j, i) => {
    if (!j) return;
    const r = slotRect(i);
    j.tx = r.x + r.w / 2; j.ty = r.y + 32; j.tw = r.w - 8; j.th = 50; j.tlid = 1; j.front = false;
  });

}

// Actions

function tapColumn(k) {
  if (S.state !== 'play' || S.overlay) return;
  const col = S.cols[k];
  if (!col || !col.length) return;
  const j = col[0], idx = S.slots.findIndex(s => !s);
  if (idx < 0) { j.shake = 1; sfxNo(); return; }
  col.shift();
  j.state = 'slot'; j.slot = idx;
  S.slots[idx] = j;
  S.placed++;
  S.active.push(j);
  settleLogic();
  sfxTap();
}

// The game's rules run instantly and exactly like the solver's settle(): each
// active jar, in placement order, claims the nearest reachable blocks of its color
// until none are left, looping until nothing changes. The ants then act it out, so
// a queue the solver proved winnable stays winnable however fast the player taps.
function settleLogic() {
  let moved = true;
  while (moved) {
    moved = false;
    for (const j of S.active) while (j.need > 0) {
      const i = S.board.nearest(j.c);
      if (i < 0) break;
      S.pending.set(i, j.c);
      S.board.remove(i);
      j.need--; j.todo.push(i);
      moved = true;
    }
  }
  S.active = S.active.filter(j => j.need > 0);
}

// Shortest grid route from below the picture (at the column nearest `fromX`) to a
// block, walking only through open space: a one-cell ring around the picture plus
// empty cells connected to it.
function routeTo(cell, fromX) {
  const b = S.board, RW = b.w + 2, RH = b.h + 2;
  const open = r => {
    const x = r % RW - 1, y = ((r / RW) | 0) - 1;
    if (x < 0 || y < 0 || x >= b.w || y >= b.h) return true;
    const i = y * b.w + x;
    return b.cells[i] < 0 && b.outside[i] === 1;
  };
  const goal = (((cell / b.w) | 0) + 1) * RW + cell % b.w + 1;
  const entry = (RH - 1) * RW + clamp(Math.floor((fromX - G.x) / G.cell) + 1, 0, RW - 1);
  const prev = new Int32Array(RW * RH).fill(-2);
  prev[entry] = -1;
  const queue = [entry];
  let end = -1;
  for (let qi = 0; qi < queue.length && end < 0; qi++) {
    const r = queue[qi], x = r % RW, y = (r / RW) | 0;
    for (const [nx, ny] of [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]) {
      if (nx < 0 || ny < 0 || nx >= RW || ny >= RH) continue;
      const n = ny * RW + nx;
      if (n === goal) { end = r; break; }
      if (prev[n] !== -2 || !open(n)) continue;
      prev[n] = r;
      queue.push(n);
    }
  }
  if (end < 0) return null;
  const steps = [];
  for (let r = end; r >= 0; r = prev[r]) steps.push(r);
  steps.reverse().push(goal);
  return steps.map(r => ({ x: G.x + (r % RW - 0.5) * G.cell, y: G.y + (((r / RW) | 0) - 0.5) * G.cell }));
}

// An ant climbs out of its jar, up to the lane, across to its column (stepping
// wide of the anthill), and along open space to its block. Each ant keeps a small
// lane offset so a column of ants doesn't stack into one.
function spawnAnt(j, t) {
  const o = Math.max(G.cell * 0.2, 2), ox = rand(-o, o), oy = rand(-o, o);
  let ex = j.x;
  if (Math.abs(ex - HILL.x) < 58) ex = HILL.x + (ex >= HILL.x ? 58 : -58);
  const pts = (routeTo(t, ex) || [cellCenter(t)]).map(p => ({ x: p.x + ox, y: p.y + oy }));
  const sx = j.x + ox, sy = j.y - j.h * 0.3;
  const path = [{ x: sx, y: LANE_Y + oy }, { x: pts[0].x, y: LANE_Y + oy }, ...pts];
  S.ants.push({ x: sx, y: sy, path, stage: 'out', ox, oy,
    cell: t, c: j.c, carry: false, ang: -Math.PI / 2, ph: rand(0, 6) });
}

// With its block, the ant walks the open route to the column above the anthill and
// drops down into the hole.
function routeHome(a) {
  const back = routeTo(a.cell, HILL.x);
  if (!back) return [{ x: HILL.x, y: a.y }, { x: HILL.x, y: HILL.y }];
  const pts = back.reverse().slice(1).map(p => ({ x: p.x + a.ox, y: p.y + a.oy }));
  const last = pts.length ? pts[pts.length - 1] : { x: a.x };
  return [...pts, { x: last.x, y: HILL.y }];
}

function burst(x, y, c, n, power = 1) {
  for (let i = 0; i < n; i++) S.parts.push({
    x, y, c, vx: rand(-1, 1) * 150 * power, vy: rand(-1.4, -0.3) * 190 * power, g: 600,
    t: 0, life: rand(0.45, 0.85), s: rand(3, 6), rot: rand(0, 6), vr: rand(-8, 8),
  });
}
function confetti() {
  const cols = [...new Set(LEVEL_DEFS.flatMap(l => l.cells).filter(c => c >= 0))];
  for (let i = 0; i < 160; i++) S.parts.push({
    x: rand(0, W), y: rand(-80, -5), c: cols[i % cols.length], vx: rand(-50, 50), vy: rand(60, 240), g: 90,
    t: 0, life: rand(2.2, 3.5), s: rand(5, 9), rot: rand(0, 6), vr: rand(-6, 6),
  });
}

function win() {
  S.state = 'win';
  sfxWin(); confetti();
  const custom = !!S.def.custom, last = !custom && S.levelIdx === LEVEL_DEFS.length - 1;
  const btns = [];
  if (!custom && !last) btns.push({ label: 'Next level', color: '#35c75a', fn: () => loadBuiltin(S.levelIdx + 1) });
  if (custom || last) btns.push({ label: 'Use my own image', color: '#2b7be9', fn: openFile });
  btns.push({ label: 'Play again', color: '#f8922a', fn: restart });
  S.overlay = {
    title: 'Delicious!',
    sub: custom ? 'Your picture has been carried off, crumb by crumb.'
      : last ? 'You cleared every level! Try feeding the ants one of your own images.'
      : `The ants loved the ${S.def.name.toLowerCase()}.`,
    buttons: btns,
  };
}

function stuck() {
  S.state = 'stuck';
  sfxStuck();
  const btns = [];
  if (!S.extraUsed) btns.push({ label: '+1 Extra slot', color: '#35c75a', fn: () => {
    S.slots.push(null); S.extraUsed = true; S.state = 'play'; S.overlay = null; S.stuckT = 0;
  } });
  btns.push({ label: 'Try again', color: '#f8922a', fn: restart });
  S.overlay = { title: 'Out of room!', sub: "Every jar is waiting on a color the ants can't reach yet.", buttons: btns };
}

// Logic is always settled, so this is exact: every slot's capacity is held by jars
// still needing blocks (or the queue is empty and they never will finish). It
// waits for the ants to finish setting out so the last moves play before it shows.
function isStuck() {
  if (!S.active.length || S.slots.some(j => j && j.todo.length)) return false;
  return S.active.length >= S.slots.length || S.cols.every(c => !c.length);
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt, rdt) {
  S.time += rdt;
  if (S.toast && (S.toast.t -= rdt) <= 0) S.toast = null;
  layoutJars(false);
  const k = 1 - Math.exp(-rdt * 16);
  for (const j of allJars()) {
    j.x += (j.tx - j.x) * k; j.y += (j.ty - j.y) * k;
    j.w += (j.tw - j.w) * k; j.h += (j.th - j.h) * k;
    j.lid += (j.tlid - j.lid) * k;
    j.shake = Math.max(0, j.shake - rdt * 3);
  }

  if (S.state === 'play' && !S.overlay) {
    // Each jar sends an ant for every block it has claimed, counting down as they
    // leave; an empty jar pops and frees its slot.
    for (const j of S.slots) {
      if (!j || j.state !== 'slot') continue;
      j.spawnT -= dt;
      if (Math.hypot(j.x - j.tx, j.y - j.ty) >= 6 || j.spawnT > 0 || !j.todo.length) continue;
      spawnAnt(j, j.todo.shift());
      sfxAnt();
      j.rem--; j.spawnT = SPAWN_GAP;
      if (j.rem <= 0) { j.state = 'done'; j.doneT = 0; burst(j.x, j.y, j.c, 18); sfxJar(j); }
    }

    // Move ants along their orthogonal waypoints: out to the block, then home to
    // the anthill with it.
    for (let i = S.ants.length - 1; i >= 0; i--) {
      const a = S.ants[i];
      let step = ANT_SPEED * dt;
      a.ph += dt * 24;
      while (step > 0 && a.path.length) {
        const p = a.path[0], dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
        if (d <= step) { a.x = p.x; a.y = p.y; step -= d; a.path.shift(); continue; }
        a.x += dx / d * step; a.y += dy / d * step; step = 0;
        a.ang = lerpAngle(a.ang, Math.atan2(dy, dx), 1 - Math.exp(-dt * 22));
      }
      if (a.path.length) continue;
      if (a.stage === 'out') {
        S.pending.delete(a.cell);
        erased.push(a.cell);
        a.carry = true;
        burst(a.x, a.y, a.c, 3, 0.4);
        a.stage = 'home';
        a.path = routeHome(a);
      } else {
        S.ants.splice(i, 1);   // down the hole
      }
    }

    S.slots.forEach((j, idx) => {
      if (j && j.state === 'done') { j.doneT += rdt; if (j.doneT >= 0.35) S.slots[idx] = null; }
    });

    if (S.board.count === 0 && !S.ants.length && S.slots.every(s => !s)) {
      S.winT += rdt;
      if (S.winT > 0.4) win();
    } else if (isStuck()) {
      S.stuckT += rdt;
      if (S.stuckT > 0.8) stuck();
    } else S.stuckT = 0;
  }

  for (let i = S.parts.length - 1; i >= 0; i--) {
    const p = S.parts[i];
    p.t += rdt; p.vy += p.g * rdt; p.x += p.vx * rdt; p.y += p.vy * rdt; p.rot += p.vr * rdt;
    if (p.t > p.life) S.parts.splice(i, 1);
  }
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
function text(str, x, y, size, fill = '#fff', stroke = '#3a2a48', lw = 5, align = 'center') {
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `600 ${size}px ${FONT}`;
  const words = str.split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function drawBlock(g, x, y, s, c) {
  const sh = SH[c], p = s * 0.05, bw = s - 2 * p, r = s * 0.2;
  g.fillStyle = sh.dark; rr(g, x + p, y + p, bw, bw, r); g.fill();
  g.fillStyle = sh.base; rr(g, x + p, y + p, bw, bw * 0.78, r); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.28)'; rr(g, x + p + s * 0.14, y + p + s * 0.12, s * 0.34, s * 0.13, s * 0.065); g.fill();
}

function renderBoard() {
  boardDirty = false;
  const k = scale * dpr;
  boardCv.width = Math.max(1, Math.round(G.w * k));
  boardCv.height = Math.max(1, Math.round(G.h * k));
  boardCtx.setTransform(boardCv.width / G.w, 0, 0, boardCv.height / G.h, 0, 0);
  const { w, cells } = S.board, s = G.cell;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i] >= 0 ? cells[i] : S.pending.has(i) ? S.pending.get(i) : -1;   // claimed blocks stay until picked up
    if (c >= 0) drawBlock(boardCtx, (i % w) * s, ((i / w) | 0) * s, s, c);
  }
}

function addButton(x, y, w, h, fn, modal = false) { buttons.push({ x, y, w, h, fn, modal }); }

function drawLogo() {
  ctx.save();
  ctx.translate(18, 10); ctx.rotate(-0.05);
  ctx.font = `700 28px ${FONT}`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = 8; ctx.strokeStyle = '#1f3b8f';
  const g1 = ctx.createLinearGradient(0, 6, 0, 28);
  g1.addColorStop(0, '#fff47d'); g1.addColorStop(1, '#ffa722');
  ctx.strokeText('PIXEL', 4, 30); ctx.fillStyle = g1; ctx.fillText('PIXEL', 4, 30);
  const g2 = ctx.createLinearGradient(0, 36, 0, 58);
  g2.addColorStop(0, '#a6f2ff'); g2.addColorStop(1, '#2f7ff0');
  ctx.strokeText('GRAB', 12, 60); ctx.fillStyle = g2; ctx.fillText('GRAB', 12, 60);
  ctx.restore();
}

function iconButton(cx, cy, kind, fn) {
  ctx.fillStyle = '#4c57b8'; ellipse(cx, cy + 3, 20, 20); ctx.fill();
  ctx.fillStyle = '#6f7cf0'; ellipse(cx, cy, 20, 20); ctx.fill();
  ctx.save(); ctx.translate(cx, cy);
  ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'image') {
    rr(ctx, -10, -8, 20, 16, 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7, 5); ctx.lineTo(-2, -1); ctx.lineTo(1, 2); ctx.lineTo(4, -1); ctx.lineTo(7, 5); ctx.closePath(); ctx.fill();
    ellipse(4, -4, 1.8, 1.8); ctx.fill();
  } else if (kind === 'restart') {
    const a0 = -Math.PI * 0.35, a1 = Math.PI * 1.35, r = 8;
    ctx.beginPath(); ctx.arc(0, 0, r, a0, a1); ctx.stroke();
    const ex = Math.cos(a1) * r, ey = Math.sin(a1) * r;
    const tx = -Math.sin(a1), ty = Math.cos(a1);
    ctx.beginPath();
    ctx.moveTo(ex + tx * 4.5, ey + ty * 4.5);
    ctx.lineTo(ex - ty * 4, ey + tx * 4);
    ctx.lineTo(ex + ty * 4, ey - tx * 4);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'music' || kind === 'music-off') {
    ellipse(-4, 6, 3.6, 2.8); ctx.fill();
    ellipse(6, 3, 3.6, 2.8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.6, 6); ctx.lineTo(-0.6, -8); ctx.lineTo(9.4, -10); ctx.lineTo(9.4, 3); ctx.stroke();
    if (kind === 'music-off') { ctx.beginPath(); ctx.moveTo(-11, -11); ctx.lineTo(11, 11); ctx.stroke(); }
  } else if (kind === 'sound' || kind === 'mute') {
    ctx.beginPath(); ctx.moveTo(-10, -3.5); ctx.lineTo(-5, -3.5); ctx.lineTo(0, -8.5); ctx.lineTo(0, 8.5); ctx.lineTo(-5, 3.5); ctx.lineTo(-10, 3.5); ctx.closePath(); ctx.fill();
    if (kind === 'sound') {
      ctx.beginPath(); ctx.arc(1, 0, 5, -0.8, 0.8); ctx.stroke();
      ctx.beginPath(); ctx.arc(1, 0, 9, -0.8, 0.8); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(4, -4); ctx.lineTo(11, 4); ctx.moveTo(11, -4); ctx.lineTo(4, 4); ctx.stroke();
    }
  } else {
    ctx.restore();
    text(kind, cx, cy + 1, 17, '#fff', '#3a3f8f', 0);
    ctx.save();
  }
  ctx.restore();
  addButton(cx - 22, cy - 22, 44, 44, fn);
}

function chevronButton(cx, cy, dir, fn) {
  ctx.fillStyle = '#c9794a'; ellipse(cx, cy + 2, 15, 15); ctx.fill();
  ctx.fillStyle = '#e99a66'; ellipse(cx, cy, 15, 15); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - dir * 2, cy - 6); ctx.lineTo(cx + dir * 4, cy); ctx.lineTo(cx - dir * 2, cy + 6); ctx.stroke();
  addButton(cx - 20, cy - 18, 40, 36, fn);
}

function drawTop() {
  drawLogo();
  iconButton(386, 34, 'image', openFile);
  iconButton(338, 34, 'restart', restart);
  iconButton(290, 34, S.speed === 2 ? '2x' : '1x', () => { S.speed = S.speed === 2 ? 1 : 2; });
  iconButton(242, 34, muted ? 'mute' : 'sound', () => { muted = !muted; save('pixelgrab.muted', muted); syncMusic(); });
  iconButton(194, 34, musicTrack >= 0 ? 'music' : 'music-off', nextTrack);
  const name = S.def.custom ? 'Your image' : `Level ${S.levelIdx + 1} · ${S.def.name}`;
  text(name, 215, 86, 19, '#fff', '#a8643c', 5);
  chevronButton(52, 86, -1, () => loadBuiltin(S.def.custom ? S.levelIdx : S.levelIdx - 1));
  chevronButton(378, 86, 1, () => loadBuiltin(S.def.custom ? S.levelIdx : S.levelIdx + 1));
}

function drawTray() {
  ctx.fillStyle = 'rgba(120,60,20,0.12)'; rr(ctx, TRAY.x, TRAY.y + 5, TRAY.w, TRAY.h, 24); ctx.fill();
  ctx.fillStyle = '#f8e9db'; rr(ctx, TRAY.x, TRAY.y, TRAY.w, TRAY.h, 24); ctx.fill();
  ctx.fillStyle = '#efd6c0'; rr(ctx, TRAY.x + 9, TRAY.y + 9, TRAY.w - 18, TRAY.h - 18, 16); ctx.fill();
  // blocks-left progress along the bottom edge
  const frac = 1 - (S.board.count + S.pending.size) / S.total;
  ctx.fillStyle = 'rgba(160,90,40,0.18)'; rr(ctx, TRAY.x + 40, TRAY.y + TRAY.h - 6, TRAY.w - 80, 4, 2); ctx.fill();
  if (frac > 0) { ctx.fillStyle = '#35c75a'; rr(ctx, TRAY.x + 40, TRAY.y + TRAY.h - 6, (TRAY.w - 80) * frac, 4, 2); ctx.fill(); }
}

function drawHill() {
  const { x, y } = HILL;
  ctx.fillStyle = 'rgba(120,60,20,0.12)'; ellipse(x, y + 6, 52, 22); ctx.fill();
  ctx.fillStyle = '#dcaa80'; ellipse(x, y, 46, 23); ctx.fill();
  ctx.fillStyle = '#e8bb93'; ellipse(x - 4, y - 4, 36, 15); ctx.fill();
  const g = ctx.createRadialGradient(x, y + 3, 2, x, y, 28);
  g.addColorStop(0, '#1b0f08'); g.addColorStop(1, '#6b4027');
  ctx.fillStyle = g; ellipse(x, y, 26, 14); ctx.fill();
}

function drawJar(j) {
  const sh = SH[j.c];
  let s = 1, alpha = 1;
  if (j.state === 'done') { const t = Math.min(1, j.doneT / 0.35); s = 1 + t * 0.45; alpha = 1 - t; }
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(j.x + Math.sin(S.time * 45) * j.shake * 6, j.y);
  ctx.scale(s, s);
  const w = j.w, h = j.h;
  if (j.front && j.state === 'queue') {
    ctx.fillStyle = 'rgba(120,60,20,0.15)'; rr(ctx, -w / 2 - 6, -h / 2 - 3, w + 12, h + 12, 18); ctx.fill();
    ctx.fillStyle = '#fff'; rr(ctx, -w / 2 - 6, -h / 2 - 6, w + 12, h + 12, 18); ctx.fill();
    ctx.fillStyle = '#7a4a2e'; rr(ctx, -w / 2 - 2.5, -h / 2 - 2.5, w + 5, h + 5, 15); ctx.fill();   // reads on white jars too
  }
  if (j.lid > 0.02) {
    const lw = w * 0.62, lh = h * 0.26 * j.lid, ly = -h / 2 - lh * 0.8;
    ctx.fillStyle = sh.dark; rr(ctx, -lw / 2, ly, lw, lh + 8, 7); ctx.fill();
    ctx.fillStyle = sh.base; rr(ctx, -lw / 2 + 3, ly + 2, lw - 6, lh * 0.55, 4); ctx.fill();
  }
  ctx.fillStyle = sh.dark; rr(ctx, -w / 2, -h / 2, w, h, 14); ctx.fill();
  ctx.fillStyle = sh.base; rr(ctx, -w / 2, -h / 2, w, h - 8, 14); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; rr(ctx, -w / 2 + 8, -h / 2 + 6, w * 0.34, 6, 3); ctx.fill();
  const waiting = j.state === 'slot' && j.need > 0 && !j.todo.length;   // nothing of its color reachable
  if (waiting) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; rr(ctx, -w / 2, -h / 2, w, h, 14); ctx.fill(); }
  text(String(j.rem), 0, -3, Math.min(28, w * 0.42, h * 0.6), '#fff', '#3a2a48', 5);
  if (waiting) text('z z', w / 2 - 8, -h / 2 - 10 + Math.sin(S.time * 3) * 2, 13, '#fff', '#8a6a55', 3.5);
  ctx.restore();
}

function drawSlots() {
  S.slots.forEach((_, i) => {
    const r = slotRect(i);
    ctx.fillStyle = 'rgba(255,255,255,0.22)'; rr(ctx, r.x + 2, r.y + 2, r.w - 4, r.h - 16, 14); ctx.fill();
    ctx.fillStyle = 'rgba(120,60,20,0.12)'; rr(ctx, r.x, r.y + r.h - 20, r.w, 22, 10); ctx.fill();
    ctx.fillStyle = '#fff'; rr(ctx, r.x, r.y + r.h - 24, r.w, 22, 10); ctx.fill();
  });
  if (S.placed === 0 && S.slots.every(s => !s) && S.state === 'play') {
    text('Tap a jar to send out its ants!', 215, 570 + Math.sin(S.time * 4) * 2, 17, '#fff', '#b0714a', 5);
  }
  for (const j of S.slots) if (j) drawJar(j);
}

function drawQueue() {
  S.cols.forEach((col, k) => {
    for (let r = Math.min(col.length - 1, QUEUE_ROWS); r >= 0; r--) drawJar(col[r]);
    if (col.length > QUEUE_ROWS) {
      const x = QX(k) + 36, y = QY(QUEUE_ROWS - 1) + 20;
      ctx.fillStyle = '#7a4a2e'; rr(ctx, x - 17, y - 11, 34, 22, 11); ctx.fill();
      text(`+${col.length - QUEUE_ROWS}`, x, y, 13, '#fff', '', 0);
    }
  });
}

function drawAnt(a) {
  const sc = clamp(G.cell / 18, 0.6, 1.15), sh = SH[a.c], lg = Math.sin(a.ph);
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.fillStyle = 'rgba(80,40,10,0.15)'; ellipse(0, 3 * sc, 9 * sc, 4 * sc); ctx.fill();
  ctx.rotate(a.ang); ctx.scale(sc, sc);
  ctx.strokeStyle = sh.darker; ctx.lineWidth = 1.3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const roots = [-1.6, 0, 1.6], tips = [-5, 0.5, 5];
  for (let k = 0; k < 3; k++) for (const side of [-1, 1]) {
    const ph = ((k % 2 === 0) === (side === 1)) ? lg : -lg;
    ctx.beginPath();
    ctx.moveTo(roots[k], 0);
    ctx.lineTo((roots[k] + tips[k]) / 2 + ph * 1.2, side * 4.2);
    ctx.lineTo(tips[k] + ph * 2.2, side * 6.8);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(6, -1); ctx.quadraticCurveTo(9, -3, 10.5, -4.8);
  ctx.moveTo(6, 1); ctx.quadraticCurveTo(9, 3, 10.5, 4.8);
  ctx.stroke();
  ctx.fillStyle = sh.base; ctx.lineWidth = 1;
  ellipse(-5, 0, 4.6, 3.6); ctx.fill(); ctx.stroke();
  ellipse(0, 0, 2.4, 2); ctx.fill(); ctx.stroke();
  ellipse(4.6, 0, 2.9, 2.7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ellipse(-5.8, -1.3, 1.7, 1); ctx.fill();
  ctx.fillStyle = '#fff'; ellipse(5.6, -1.3, 1, 1); ctx.fill(); ellipse(5.6, 1.3, 1, 1); ctx.fill();
  ctx.fillStyle = '#111'; ellipse(6, -1.3, 0.5, 0.5); ctx.fill(); ellipse(6, 1.3, 0.5, 0.5); ctx.fill();
  ctx.restore();
  if (a.carry) {
    const bs = 9 * sc;
    drawBlock(ctx, a.x - bs / 2, a.y - bs / 2 - 3 * sc, bs, a.c);
  }
}

function drawParticles() {
  for (const p of S.parts) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = SH[p.c].base;
    ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.7);
    ctx.restore();
  }
}

function drawOverlay() {
  const o = S.overlay;
  ctx.fillStyle = 'rgba(60,30,15,0.45)'; ctx.fillRect(0, 0, W, H);
  const subLines = wrap(o.sub || '', 270, 17);
  const bh = 52, gap = 12, pw = 340, px = (W - pw) / 2;
  const ph = 104 + subLines.length * 24 + o.buttons.length * (bh + gap) + 14;
  const py = (H - ph) / 2 - 30;
  ctx.fillStyle = 'rgba(80,40,10,0.25)'; rr(ctx, px, py + 8, pw, ph, 26); ctx.fill();
  ctx.fillStyle = '#fff6ea'; rr(ctx, px, py, pw, ph, 26); ctx.fill();
  text(o.title, W / 2, py + 50, 36, '#ffd23f', '#7a3d1f', 8);
  subLines.forEach((l, i) => text(l, W / 2, py + 94 + i * 24, 17, '#7a4a2e', '', 0));
  let y = py + 94 + subLines.length * 24 + 6;
  for (const b of o.buttons) {
    const bx = px + 36, bw = pw - 72;
    ctx.fillStyle = rgbStr(mix(hexToRgb(b.color), -0.25)); rr(ctx, bx, y + 4, bw, bh, 18); ctx.fill();
    ctx.fillStyle = b.color; rr(ctx, bx, y, bw, bh, 18); ctx.fill();
    text(b.label, W / 2, y + bh / 2, 21, '#fff', 'rgba(40,20,10,0.45)', 4);
    addButton(bx, y, bw, bh + 4, b.fn, true);
    y += bh + gap;
  }
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  buttons = [];
  drawTop();
  drawTray();
  if (boardDirty) renderBoard();
  else if (erased.length) {
    // Blocks sit inside their cells, so clearing just the taken cell is enough.
    const w = S.board.w, s = G.cell;
    for (const i of erased) boardCtx.clearRect((i % w) * s, ((i / w) | 0) * s, s, s);
  }
  erased = [];
  ctx.drawImage(boardCv, G.x, G.y, G.w, G.h);
  drawHill();
  drawSlots();
  drawQueue();
  for (const a of S.ants) drawAnt(a);
  drawParticles();
  if (S.toast) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, S.toast.t * 3);
    ctx.font = `600 15px ${FONT}`;
    const w = ctx.measureText(S.toast.text).width + 28;
    ctx.fillStyle = 'rgba(70,40,20,0.8)'; rr(ctx, 215 - w / 2, 112, w, 28, 14); ctx.fill();
    text(S.toast.text, 215, 126, 15, '#fff', '', 0);
    ctx.restore();
  }
  if (S.overlay) drawOverlay();
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px';
  cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  boardDirty = true;
}
window.addEventListener('resize', resize);

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioUnlock();
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left) / scale, py = (e.clientY - r.top) / scale;
  for (let i = buttons.length - 1; i >= 0; i--) {
    const b = buttons[i];
    if (S.overlay && !b.modal) continue;
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) { b.fn(); return; }
  }
  if (S.overlay) return;
  S.cols.forEach((col, k) => {
    const j = col[0];
    if (j && Math.abs(px - j.x) < j.w / 2 + 8 && Math.abs(py - j.y) < j.h / 2 + 8) tapColumn(k);
  });
});

window.addEventListener('keydown', e => {
  audioUnlock();
  if (e.key >= '1' && e.key <= '3') tapColumn(+e.key - 1);
  else if (e.key === 'r' || e.key === 'R') { if (!S.overlay || S.state !== 'play') restart(); }
});

// Image upload (button or drag & drop)
const fileInput = document.getElementById('file');
let overlayBeforeUpload = null;
function openFile() { fileInput.click(); }
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  fileInput.value = '';
  if (f) handleFile(f);
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});
function handleFile(f) {
  if (!f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => { URL.revokeObjectURL(url); makeCustom(img); };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    showMessage('Hmm...', "That file couldn't be read as an image.");
  };
  img.src = url;
}
function closeUploadOverlay() { S.overlay = S.state === 'play' ? null : overlayBeforeUpload; }
function showMessage(title, sub) {
  overlayBeforeUpload = S.overlay && S.overlay.upload ? overlayBeforeUpload : S.overlay;
  S.overlay = { upload: true, title, sub, buttons: [{ label: 'OK', color: '#f8922a', fn: closeUploadOverlay }] };
}
function makeCustom(img) {
  const px = pixelate(img, GRID_MAX);
  if (!px) { showMessage('Hmm...', "That image couldn't be read. Try another one!"); return; }
  loadLevel({ custom: true, name: 'Your image', w: px.w, h: px.h, cells: px.cells,
              chunk: [22, 45], dist: 7, target: 0.5 });
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
resize();
loadBuiltin(clamp(load('pixelgrab.level', 0) | 0, 0, LEVEL_DEFS.length - 1));
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(rdt * S.speed * ANIM_SCALE, rdt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts) document.fonts.ready.then(() => { boardDirty = true; });
</script>
</body>
